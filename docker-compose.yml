---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./wyckoff:/freqtrade/wyckoff"
    environment:
      - PYTHONPATH=/freqtrade
      - WY_PNF_SHADOW_PROTECT=${WY_PNF_SHADOW_PROTECT:-0}
      - WY_PNF_AXIS_ENABLE=${WY_PNF_AXIS_ENABLE:-0}
      - WY_PNF_WAVE_START_ENABLE=${WY_PNF_WAVE_START_ENABLE:-0}
      - WY_PNF_SOS_EARLY_MULT=${WY_PNF_SOS_EARLY_MULT:-1.0}
      - WY_SKIP_PNF_VALIDATION=${WY_SKIP_PNF_VALIDATION:-0}
    # Expose api on port 8080 (localhost only)
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "127.0.0.1:8080:8080"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config_v8_dryrun.json
      --strategy WyckoffV8

  freqtrade-hybrid:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade-hybrid
    volumes:
      - "./user_data:/freqtrade/user_data"
    environment:
      - PYTHONPATH=/freqtrade
    ports:
      - "127.0.0.1:8081:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/hybrid_dryrun.log
      --config /freqtrade/user_data/config_dryrun.json
      --config /freqtrade/user_data/config_hybrid_dryrun.json
      --strategy HybridTraderV1
